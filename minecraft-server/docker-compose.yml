# Minecraft-Server (PaperMC) mit automatischen Backups.
# Start:  docker compose up -d
# Logs:   docker compose logs -f mc
# Konsole: docker attach minecraft  (verlassen mit Strg+P, Strg+Q)
services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"            # Zustimmung zur Minecraft-EULA (Pflicht)
      TYPE: "PAPER"           # PaperMC: performanter als Vanilla
      VERSION: "LATEST"
      MEMORY: "2G"            # bei 4 GB RAM auf "3G" erhöhen
      TZ: "Europe/Berlin"
      # Empfohlene Grundeinstellungen:
      DIFFICULTY: "normal"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "8"      # kleiner = weniger RAM/CPU
      ENABLE_WHITELIST: "TRUE"
      # Spieler eintragen (kommagetrennt), dann Container neu starten:
      # WHITELIST: "Spieler1,Spieler2"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true

  backups:
    image: itzg/mc-backup:latest
    container_name: minecraft-backup
    restart: unless-stopped
    depends_on:
      - mc
    environment:
      BACKUP_INTERVAL: "24h"
      PRUNE_BACKUPS_DAYS: "7"   # Backups älter als 7 Tage löschen
      RCON_HOST: "mc"
      TZ: "Europe/Berlin"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
