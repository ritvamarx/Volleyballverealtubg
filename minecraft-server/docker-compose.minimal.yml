# Sparvariante: PaperMC-Server für 2–5 Spieler mit 1 GB RAM.
# Läuft auf einem Raspberry Pi 4 (2 GB) oder der kleinsten VPS-Stufe.
#
# Start:  docker compose -f docker-compose.minimal.yml up -d
#
# Unterschiede zur Standardvariante (docker-compose.yml):
#   - 1 GB statt 2 GB Heap
#   - view-distance 6 statt 8, simulation-distance 4
#   - keine Backup-Container (spart ~50 MB RAM; siehe Hinweis unten)
services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "LATEST"
      MEMORY: "1G"
      TZ: "Europe/Berlin"

      # --- Die wirksamsten Sparmaßnahmen ---
      VIEW_DISTANCE: "6"          # größter Hebel beim RAM-Bedarf
      SIMULATION_DISTANCE: "4"    # weniger aktive Mobs und Redstone = weniger CPU
      MAX_PLAYERS: "5"

      DIFFICULTY: "normal"
      ENABLE_WHITELIST: "TRUE"
      # WHITELIST: "Spieler1,Spieler2"

      # Weniger Mobs = spürbar weniger CPU-Last
      SPAWN_MONSTERS: "true"
      SPAWN_ANIMALS: "true"
      SPAWN_NPCS: "false"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true

# Hinweis zu Backups: Diese Variante spart den Backup-Container ein. Stattdessen
# per Cron auf dem Host sichern, z. B. täglich um 4 Uhr:
#   0 4 * * * cd /pfad/zu/minecraft-server && tar czf backups/world-$(date +\%F).tar.gz data/world*
# Wer Backups automatisch möchte, nimmt docker-compose.yml — der Backup-Container
# braucht rund 50 MB zusätzlich.
