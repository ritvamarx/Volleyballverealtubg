# Content-Hub – /opt/contenthub/docker-compose.yml
# Läuft neben den bestehenden nettverwaltet-Diensten hinter dem einen Caddy.
#
# Voraussetzung: das externe Docker-Netz, in dem euer Caddy hängt
# (Name prüfen mit: docker network ls – unten ggf. "caddy" anpassen).
#
# Stufe 1: n8n + postgres
# Stufe 2: zusätzlich nocodb   → Profil "board"    (docker compose --profile board up -d)
# Stufe 5: zusätzlich renderer → Profil "visuals"  (docker compose --profile visuals up -d)

services:
  postgres:
    image: postgres:16-alpine
    container_name: contenthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      # legt beim ersten Start zusätzlich die Hub-Datenbank "contenthub" an
      - ./sql/00-init-databases.sh:/docker-entrypoint-initdb.d/00-init-databases.sh:ro
      - ./sql/schema.sql:/contenthub-schema/schema.sql:ro   # bewusst NICHT in initdb.d (sonst liefe es gegen die n8n-DB)
    networks:
      - intern
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 30s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: contenthub-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- Erreichbarkeit
      N8N_HOST: n8n.nettverwaltet.de
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://n8n.nettverwaltet.de/
      N8N_EDITOR_BASE_URL: https://n8n.nettverwaltet.de/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      # --- Datenbank
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # --- Sicherheit / Betrieb
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"          # Stunden → 7 Tage
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "5000"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      # --- Zugriff auf Dateien (Medien, Mandantenprofile) innerhalb des Containers
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      # Werte, die Workflows als $env lesen dürfen
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      CONTENTHUB_DB_HOST: postgres
      CONTENTHUB_DB_NAME: contenthub
      CONTENTHUB_MEDIA_BASE_URL: https://media.nettverwaltet.de
      CONTENTHUB_RENDERER_URL: http://renderer:8000
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./data/media:/files/media
      - ./mandanten:/files/mandanten:ro
    networks:
      - intern
      - caddy
    expose:
      - "5678"

  # ---------------------------------------------------------------- Stufe 2
  nocodb:
    image: nocodb/nocodb:latest
    container_name: contenthub-nocodb
    profiles: ["board"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # NocoDB-Metadaten liegen in einer eigenen DB "nocodb" (legt 00-init-databases.sh an);
      # die Hub-Tabellen werden in NocoDB als "externe Datenquelle" (contenthub) eingebunden.
      NC_DB: "pg://postgres:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=nocodb"
      NC_PUBLIC_URL: https://hub.nettverwaltet.de
      NC_AUTH_JWT_SECRET: ${NOCODB_JWT_SECRET}
      NC_DISABLE_TELE: "true"
    volumes:
      - ./data/nocodb:/usr/app/data
    networks:
      - intern
      - caddy
    expose:
      - "8080"

  # ---------------------------------------------------------------- Stufe 5
  renderer:
    build:
      context: ./renderer
    image: contenthub-renderer:latest
    container_name: contenthub-renderer
    profiles: ["visuals"]
    restart: unless-stopped
    environment:
      TEMPLATE_DIR: /templates
      OUTPUT_DIR: /files/media
    volumes:
      - ./templates:/templates:ro
      - ./data/media:/files/media
    networks:
      - intern            # bewusst NICHT im Caddy-Netz: nur n8n ruft ihn auf
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 1g

networks:
  intern:
    driver: bridge
  caddy:
    external: true
