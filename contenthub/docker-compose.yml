# Content-Hub – /opt/contenthub/docker-compose.yml  (VM 2 „hub“, eigener Server)
#
# Eigener Caddy auf diesem Server; keine Abhängigkeit zur nettverwaltet-VM.
# Stufe 1: caddy + n8n + postgres
# Stufe 2: zusätzlich nocodb   → docker compose --profile board up -d
# Stufe 5: zusätzlich renderer → docker compose --profile visuals up -d --build
# Lokale Werkstatt (Mac): docker compose -f docker-compose.yml -f compose.lokal.yml up

services:
  caddy:
    image: caddy:2
    container_name: contenthub-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
      - ./data/media:/srv/media:ro          # media.nettverwaltet.de (öffentlich, nur lesen)
    networks:
      - web
    mem_limit: 256m

  postgres:
    image: postgres:16-alpine
    container_name: contenthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./sql/00-init-databases.sh:/docker-entrypoint-initdb.d/00-init-databases.sh:ro
      - ./sql/schema.sql:/contenthub-schema/schema.sql:ro   # bewusst NICHT in initdb.d (sonst liefe es gegen die n8n-DB)
    networks:
      - intern
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: contenthub-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- Erreichbarkeit
      N8N_HOST: ${N8N_HOST:-n8n.nettverwaltet.de}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_PORT: "5678"
      WEBHOOK_URL: ${WEBHOOK_URL:-https://n8n.nettverwaltet.de/}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL:-https://n8n.nettverwaltet.de/}
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      # --- Datenbank
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # --- Sicherheit / Betrieb
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"          # Stunden → 7 Tage
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "5000"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      # --- Dateien, die Workflows zur Laufzeit lesen (Schichten 1–3, siehe PLAN-INFRASTRUKTUR.md)
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      CONTENTHUB_DB_HOST: postgres
      CONTENTHUB_DB_NAME: contenthub
      CONTENTHUB_MEDIA_BASE_URL: ${MEDIA_BASE_URL:-https://media.nettverwaltet.de}
      CONTENTHUB_RENDERER_URL: http://renderer:8000
      CONTENTHUB_FEED_BASE: ${FEED_BASE:-}    # z. B. https://mein.werkhauswaren.de – über privates Netz erreichbar
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./data/media:/files/media
      - ./mandanten:/files/mandanten:ro
      - ./prompts:/files/prompts:ro
      - ./templates:/files/templates:ro
      - ./config:/files/config:ro
      - ./workflows:/files/workflows          # Export/Import (scripts/workflows-*.sh)
    networks:
      - intern
      - web
    expose:
      - "5678"
    mem_limit: 1536m

  # ---------------------------------------------------------------- Stufe 2
  nocodb:
    image: nocodb/nocodb:latest
    container_name: contenthub-nocodb
    profiles: ["board"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NC_DB: "pg://postgres:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=nocodb"
      NC_PUBLIC_URL: https://hub.nettverwaltet.de
      NC_AUTH_JWT_SECRET: ${NOCODB_JWT_SECRET}
      NC_DISABLE_TELE: "true"
    volumes:
      - ./data/nocodb:/usr/app/data
    networks:
      - intern
      - web
    expose:
      - "8080"
    mem_limit: 512m

  # ---------------------------------------------------------------- Stufe 5
  renderer:
    build:
      context: ./renderer
    image: contenthub-renderer:latest
    container_name: contenthub-renderer
    profiles: ["visuals"]
    restart: unless-stopped
    environment:
      TEMPLATE_DIR: /templates
      OUTPUT_DIR: /files/media
    volumes:
      - ./templates:/templates:ro
      - ./data/media:/files/media
    networks:
      - intern            # nur n8n ruft ihn auf
    expose:
      - "8000"
    mem_limit: 1g

  # ---------------------------------------------------------------- Schicht 5: eigene Werkzeuge (Python)
  # Muster: je Werkzeug ein kleiner HTTP-Dienst unter werkzeuge/<name>/ (siehe werkzeuge/README.md)
  # werkzeug-slots:
  #   build: { context: ./werkzeuge/slots }
  #   profiles: ["werkzeuge"]
  #   networks: [intern]
  #   expose: ["8000"]
  #   mem_limit: 256m

networks:
  intern:
    driver: bridge
  web:
    driver: bridge
