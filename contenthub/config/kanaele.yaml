# Kanal-Limits und Standardverhalten (Schicht 1). Vom Qualitäts- und Publishing-Schritt gelesen.
instagram:
  caption_max_zeichen: 2200
  hashtags_max: 30
  carousel_slides_max: 10
  bild_formate: { carousel: "1080x1350", post: "1080x1080", story: "1080x1920" }
  medien_url_oeffentlich_noetig: true
facebook:
  text_max_zeichen: 63206
  hashtags_empfohlen_max: 3
  zeitplanung: scheduled_publish_time
website:
  artikel_status_standard: draft          # draft | publish
newsletter:
  betreff_max_zeichen: 50
  vorschau_max_zeichen: 90
app:
  titel_max_zeichen: 60
  text_max_zeichen: 400
  push_text_max_zeichen: 90
publishing:
  mindestabstand_gleicher_mandant_min: 180
  mindestabstand_verschiedene_mandanten_min: 30
  wiederholungen_bei_fehler: 3
  wiederholungs_abstand_min: 15
