# Welches Modell für welchen Schritt (Schicht 1 – Konfiguration).
# Der Anbieter steckt in der n8n-Credential mit diesem Namen; das Modell wird hier gewählt.
# Änderung: Datei speichern → Workflow „Konfiguration laden“ → wirkt beim nächsten Lauf.
anbieter:
  standard: llm-standard        # Name der n8n-Credential (OpenAI ODER Anthropic)
  vision: llm-vision            # für Foto-Verschlagwortung (Stufe 5)

schritte:
  themen:     { credential: llm-standard, modell: "<guenstiges Modell>",  temperatur: 0.3 }
  research:   { credential: llm-standard, modell: "<starkes Modell>",     temperatur: 0.2, max_tool_aufrufe: 8 }
  redaktion:  { credential: llm-standard, modell: "<starkes Modell>",     temperatur: 0.5 }
  carousel:   { credential: llm-standard, modell: "<mittleres Modell>",   temperatur: 0.6 }
  reel:       { credential: llm-standard, modell: "<mittleres Modell>",   temperatur: 0.6 }
  story:      { credential: llm-standard, modell: "<mittleres Modell>",   temperatur: 0.6 }
  text:       { credential: llm-standard, modell: "<mittleres Modell>",   temperatur: 0.5 }
  qualitaet:  { credential: llm-standard, modell: "<starkes Modell>",     temperatur: 0.0 }
  analyse:    { credential: llm-standard, modell: "<starkes Modell>",     temperatur: 0.2 }
  vision:     { credential: llm-vision,   modell: "<Vision-Modell>",      temperatur: 0.0 }

# Mandant-spezifische Abweichung (optional), z. B. strengere Modelle für Politik:
mandanten:
  spd-waren:
    qualitaet: { modell: "<staerkstes Modell>" }
