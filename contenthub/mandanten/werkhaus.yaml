id: werkhaus
name: WerkHausWaren
typ: verein

design:
  primaer: "#E0532F"        # Platzhalter – aus dem WerkHaus-CI übernehmen
  sekundaer: "#2B2B2B"
  hintergrund: "#FFF8F2"
  schrift: "Inter"
  logo: werkhaus/logo.png

tonalitaet: >
  Offen, freundlich, lokal, herzlich. Du-Form. Kurze Sätze, konkrete
  Einladungen („Komm vorbei“). Keine Werbesprache, kein Behördendeutsch,
  keine Superlative. Menschen und Begegnung stehen im Mittelpunkt, nicht
  der Verein als Institution.

zielgruppen:
  - Menschen aus Waren (Müritz) und Umgebung
  - Ehrenamtliche und solche, die es werden könnten
  - Familien, Ältere, Neuzugezogene

content_saeulen:
  - Veranstaltungen
  - Menschen
  - Ehrenamt
  - Geschichten
  - Café
  - Kino
  - Reparatur
  - Begegnung
  - Projekte

kanaele:
  instagram: "@werkhauswaren"        # bitte prüfen
  facebook: "WerkHausWaren"          # Seiten-ID nach Meta-Setup eintragen
  website: "https://werkhauswaren.de"
  app: werkhaus-app                  # nettverwaltet-Container (Ankündigung + Web-Push)

slots:
  instagram: ["Di 18:00", "Do 18:00", "Sa 10:00"]
  facebook:  ["+15min nach Instagram"]
  website:   ["Mo–Fr 09:00"]
  app:       ["sofort nach Freigabe"]

hashtags: ["#werkhauswaren", "#waren", "#müritz", "#begegnung", "#ehrenamt"]

pflichttexte:
  impressum: "WerkHausWaren e. V. · Impressum: https://werkhauswaren.de/impressum"
  hinweis_ki_bild: "Grafik mit KI-Unterstützung erstellt."

regeln:
  auto_publish: false
  quellenpflicht: false
  zweite_freigabe: false
  personen_nur_mit_einwilligung: true
  keine_kinderfotos_ohne_einwilligung: true
  keine_parteinennung: true
  ki_bilder_erlaubt: false
  max_beitraege_pro_woche: 5

freigeber:
  - ritva            # Telegram-/E-Mail-Kennung wird in n8n-Credential aufgelöst

quellen:
  - {typ: app_feed, container: werkhaus-app}
  - {typ: upload, pfad: werkhaus/eingang}
  - {typ: rss, url: "https://werkhauswaren.de/feed"}   # falls vorhanden

research_allowlist:
  - werkhauswaren.de
  - waren-mueritz.de

learnings: |
  (noch keine – wird vom Analyse-Schritt ab Stufe 6 gefüllt)
