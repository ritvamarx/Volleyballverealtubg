# Lokale Werkstatt auf dem Mac – gleiche Dateien, kein Caddy, kein TLS.
#   docker compose -f docker-compose.yml -f compose.lokal.yml up
#   → http://localhost:5678
# .env lokal mit eigenen (Test-)Werten anlegen; Credentials tragen dieselben
# Namen wie auf dem Server, damit exportierte Workflows dort sofort laufen.
services:
  caddy:
    profiles: ["niemals"]          # deaktiviert
  n8n:
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      CONTENTHUB_MEDIA_BASE_URL: http://localhost:8081
  media-lokal:                     # ersetzt media.nettverwaltet.de für lokale Tests
    image: caddy:2
    command: caddy file-server --root /srv --listen :8081
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data/media:/srv:ro
    networks:
      - web
